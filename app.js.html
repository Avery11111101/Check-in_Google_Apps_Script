<script>
  function $(sel){ return document.querySelector(sel); }
  function $all(sel){ return Array.from(document.querySelectorAll(sel)); }
  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function buildAppLinks(boot){
    const base = boot.webAppUrl;
    const eventQ = boot.eventId ? ('&eventId=' + encodeURIComponent(boot.eventId)) : '';
    return {
      admin: base + '?page=admin',
      checkin: base + '?page=checkin' + (boot.eventId ? ('&eventId=' + encodeURIComponent(boot.eventId)) : ''),
      board: base + '?page=board' + (boot.eventId ? ('&eventId=' + encodeURIComponent(boot.eventId)) : ''),
    };
  }

  function renderTopbarNav(boot){
    const links = buildAppLinks(boot);
    const current = (boot.page || '').toLowerCase();
    const nav = document.createElement('nav');
    nav.className = 'nav';
    nav.innerHTML = `
      <a href="${esc(links.admin)}" ${current==='admin'?'aria-current="page"':''}>管理</a>
      <a href="${esc(links.checkin)}" ${current==='checkin'?'aria-current="page"':''}>簽到</a>
      <a href="${esc(links.board)}" ${current==='board'?'aria-current="page"':''}>看板</a>
    `;
    return nav;
  }

  function api(name, ...args){
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(err => reject(err))
        [name](...args);
    });
  }

  function fmtTs(ts){
    if (!ts) return '';
    const d = new Date(ts);
    if (isNaN(d.getTime())) return String(ts);
    return d.toLocaleString('zh-TW', { hour12:false });
  }
</script>
