<script>
  function $(sel){ return document.querySelector(sel); }
  function $all(sel){ return Array.from(document.querySelectorAll(sel)); }
  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  /** debounce：尾端觸發。 */
  function debounce(fn, wait){
    var t = null;
    return function(){
      var ctx = this, args = arguments;
      if (t) clearTimeout(t);
      t = setTimeout(function(){ t = null; fn.apply(ctx, args); }, wait);
    };
  }

  /** 主題：light / dark，存 localStorage['theme']；空值＝跟隨系統。 */
  var THEME_LS_KEY = 'theme';
  function getStoredTheme(){
    try {
      var v = String(localStorage.getItem(THEME_LS_KEY) || '').trim().toLowerCase();
      return (v === 'light' || v === 'dark') ? v : '';
    } catch (_e) { return ''; }
  }
  function systemPrefersDark(){
    try { return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
    catch (_e) { return false; }
  }
  function applyTheme(theme){
    var t = (theme === 'light' || theme === 'dark') ? theme : (systemPrefersDark() ? 'dark' : 'light');
    try { document.documentElement.setAttribute('data-theme', t); } catch (_e) {}
  }
  function initTheme(){
    applyTheme(getStoredTheme());
    try {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      if (mq && typeof mq.addEventListener === 'function') {
        mq.addEventListener('change', function(){
          if (!getStoredTheme()) applyTheme('');
        });
      }
    } catch (_e) {}
  }
  function toggleTheme(){
    var stored = getStoredTheme();
    var current = stored || (systemPrefersDark() ? 'dark' : 'light');
    var next = current === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem(THEME_LS_KEY, next); } catch (_e) {}
    applyTheme(next);
  }
  function renderThemeToggle(){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'themeToggle';
    btn.setAttribute('aria-label', '切換淺色／深色主題');
    btn.title = '切換淺／深主題';
    btn.innerHTML =
      '<svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<circle cx="12" cy="12" r="4"/>' +
        '<path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>' +
      '</svg>' +
      '<svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>' +
      '</svg>';
    btn.addEventListener('click', toggleTheme);
    return btn;
  }

  /** 將按鈕標為「忙碌」（disabled + 顯示替代文字），完成後自動復原。 */
  function withButtonBusy(btn, asyncFn, opts){
    if (!btn) return Promise.resolve(asyncFn && asyncFn());
    var prevText = btn.textContent;
    var prevDisabled = btn.disabled;
    var busyText = (opts && opts.busyText) ? String(opts.busyText) : '處理中…';
    btn.disabled = true;
    btn.textContent = busyText;
    return Promise.resolve()
      .then(function(){ return asyncFn(); })
      .then(function(r){
        btn.disabled = prevDisabled;
        btn.textContent = prevText;
        return r;
      })
      .catch(function(err){
        btn.disabled = prevDisabled;
        btn.textContent = prevText;
        throw err;
      });
  }

  function getPinnedExecBase(){
    const p = (typeof window !== 'undefined' && window.__GAS_EXEC_BASE) ? String(window.__GAS_EXEC_BASE).trim() : '';
    return p ? p.split(/[?#]/)[0].replace(/\/$/, '') : '';
  }

  function execBaseFromScriptGoogleUrl(u){
    if (!u || u.hostname !== 'script.google.com') return '';
    const p = u.pathname || '';
    if (p.indexOf('/macros/') === -1 && p.indexOf('/d/') === -1) return '';
    if (!/\/(exec|dev)(\/|$)/.test(p)) return '';
    return u.origin + p.replace(/\/$/, '');
  }

  function inferExecBaseFromLocation(){
    try { return execBaseFromScriptGoogleUrl(new URL(window.location.href)); }
    catch (_e) { return ''; }
  }

  function inferExecBaseFromReferrer(){
    const r = document.referrer || '';
    if (!r) return '';
    try { return execBaseFromScriptGoogleUrl(new URL(r)); }
    catch (_e) { return ''; }
  }

  function resolveWebAppBase(boot){
    const pinned = getPinnedExecBase();
    if (pinned) return pinned;
    const fromRef = inferExecBaseFromReferrer();
    if (fromRef) return fromRef;
    const fromLoc = inferExecBaseFromLocation();
    if (fromLoc) return fromLoc;
    const s = (boot && boot.webAppUrl) ? String(boot.webAppUrl).trim() : '';
    if (s) return s.split(/[?#]/)[0].replace(/\/$/, '');
    return '';
  }

  function buildAppLinks(boot){
    const base = resolveWebAppBase(boot) || '';
    const ev = boot && boot.eventId ? ('&eventId=' + encodeURIComponent(boot.eventId)) : '';
    if (base) {
      return {
        admin: base + '?page=admin',
        checkin: base + '?page=checkin' + (boot && boot.eventId ? ev : ''),
        board: base + '?page=board' + (boot && boot.eventId ? ev : ''),
      };
    }
    return {
      admin: '?page=admin',
      checkin: '?page=checkin' + (boot && boot.eventId ? ev : ''),
      board: '?page=board' + (boot && boot.eventId ? ev : ''),
    };
  }

  function navLinkTarget(boot){
    return resolveWebAppBase(boot) ? '_top' : '_self';
  }

  function applyExecBaseToNav(base, boot){
    const b = String(base || '').trim().split(/[?#]/)[0].replace(/\/$/, '');
    if (!b) return;
    window.__GAS_EXEC_BASE = b;
    const ev = boot && boot.eventId ? ('&eventId=' + encodeURIComponent(boot.eventId)) : '';
    const map = {
      admin: b + '?page=admin',
      checkin: b + '?page=checkin' + (boot && boot.eventId ? ev : ''),
      board: b + '?page=board' + (boot && boot.eventId ? ev : ''),
    };
    $all('.nav a[data-nav]').forEach(function(a){
      const k = a.getAttribute('data-nav');
      if (k && map[k]) {
        a.href = map[k];
        a.target = '_top';
      }
    });
  }

  function refreshNavExecBaseFromServer(boot, onApplied){
    google.script.run
      .withSuccessHandler(function(url){
        const u = (url && String(url).trim()) ? String(url).trim() : '';
        if (u) {
          applyExecBaseToNav(u, boot);
          if (typeof onApplied === 'function') onApplied();
        }
      })
      .withFailureHandler(function(){})
      .getWebAppExecUrlForClient();
  }

  function renderTopbarNav(boot){
    const links = buildAppLinks(boot);
    const tgt = navLinkTarget(boot);
    const current = (boot.page || '').toLowerCase();
    const nav = document.createElement('nav');
    nav.className = 'nav';
    nav.innerHTML = `
      <a data-nav="admin" href="${esc(links.admin)}" target="${esc(tgt)}" rel="noopener noreferrer" ${current==='admin'?'aria-current="page"':''}>管理</a>
      <a data-nav="checkin" href="${esc(links.checkin)}" target="${esc(tgt)}" rel="noopener noreferrer" ${current==='checkin'?'aria-current="page"':''}>簽到</a>
      <a data-nav="board" href="${esc(links.board)}" target="${esc(tgt)}" rel="noopener noreferrer" ${current==='board'?'aria-current="page"':''}>看板</a>
    `;
    return nav;
  }

  function api(name, ...args){
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(err => reject(err))
        [name](...args);
    });
  }

  function formatApiError(err){
    if (err == null) return '發生未知錯誤。';
    if (typeof err === 'string') return err;
    const m = err.message != null ? String(err.message) : '';
    if (m) return m;
    try { return JSON.stringify(err); } catch (_e) { return String(err); }
  }

  function copyTextToClipboard(text){
    const t = String(text || '').trim();
    if (!t) return Promise.resolve({ ok: false, message: '沒有可複製的內容。' });
    if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
      return navigator.clipboard.writeText(t)
        .then(function(){ return { ok: true }; })
        .catch(function(err){ return { ok: false, message: formatApiError(err) }; });
    }
    return new Promise(function(resolve){
      try {
        const ta = document.createElement('textarea');
        ta.value = t;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        ta.style.top = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        resolve(ok ? { ok: true } : { ok: false, message: '無法複製（瀏覽器不支援）。' });
      } catch (err) {
        resolve({ ok: false, message: formatApiError(err) });
      }
    });
  }

  function fmtTs(ts){
    if (!ts) return '';
    const d = new Date(ts);
    if (isNaN(d.getTime())) return String(ts);
    return d.toLocaleString('zh-TW', { hour12:false });
  }

  function buildCheckinUrl(boot, eventId, _unusedToken){
    const id = String(eventId || '').trim();
    if (!id) return '';
    const base = resolveWebAppBase(boot || {});
    const path = '?page=checkin&eventId=' + encodeURIComponent(id);
    return base ? (base + path) : path;
  }

  function renderCurrentCheckinCode(hostEl, code, onCopy){
    if (!hostEl) return;
    var c = String(code || '').replace(/\D/g, '').trim();
    if (!c || c.length !== 6) {
      while (hostEl.firstChild) hostEl.removeChild(hostEl.firstChild);
      hostEl.style.display = 'none';
      return;
    }
    hostEl.style.display = '';
    while (hostEl.firstChild) hostEl.removeChild(hostEl.firstChild);
    var hint = document.createElement('div');
    hint.className = 'hint';
    hint.style.cssText = 'text-align:center;margin-top:6px';
    hint.textContent = '目前簽到驗證碼（簽到頁滑動送出前須輸入）';
    var row = document.createElement('div');
    row.className = 'row';
    row.style.cssText = 'justify-content:center;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap';
    var span = document.createElement('span');
    span.className = 'mono';
    span.style.cssText = 'font-size:1.35rem;letter-spacing:0.12em;font-weight:700';
    span.textContent = c;
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'secondary';
    btn.textContent = '複製驗證碼';
    btn.addEventListener('click', function(){
      copyTextToClipboard(c).then(function(r){
        if (typeof onCopy === 'function') onCopy(r);
      });
    });
    row.appendChild(span);
    row.appendChild(btn);
    hostEl.appendChild(hint);
    hostEl.appendChild(row);
  }

  function renderQrInHost(hostEl, text, sizePx){
    if (!hostEl) return;
    while (hostEl.firstChild) hostEl.removeChild(hostEl.firstChild);
    const t = String(text || '').trim();
    if (!t) return;
    if (typeof QRCode === 'undefined') {
      hostEl.textContent = '無法載入 QR 程式庫。';
      return;
    }
    try {
      var level = QRCode.CorrectLevel && QRCode.CorrectLevel.M != null ? QRCode.CorrectLevel.M : 0;
      new QRCode(hostEl, {
        text: t,
        width: sizePx,
        height: sizePx,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: level
      });
    } catch (_e) {
      hostEl.textContent = '無法產生 QR。';
    }
  }

  /** 在 head 解析完成前儘早套主題，避免閃白。 */
  initTheme();
</script>
