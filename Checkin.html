<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f1115">
    <base target="_top">
    <?!= include('app.css'); ?>
  </head>
  <body class="page-checkin">
    <div class="appBg">
    <div class="container">
      <div class="topbar">
        <div>
          <div class="title">簽到</div>
          <div class="subtitle">選擇姓名後，往左滑動確認</div>
        </div>
        <div class="topActions">
          <div id="topNav"></div>
          <div class="badge mono">v<?= esc(bootstrap.version) ?></div>
        </div>
      </div>

      <div class="grid">
        <div class="card">
          <h2>簽到資訊</h2>
          <div class="field">
            <label for="eventSelect">活動名稱</label>
            <select id="eventSelect">
              <option value="">載入中…</option>
            </select>
            <div id="eventHint" class="hint"></div>
          </div>

          <div class="field">
            <label for="personSearch">姓名（可搜尋或從下拉選擇）</label>
            <input type="search" id="personSearch" placeholder="輸入關鍵字篩選名單（選填）" autocomplete="off">
            <select id="personSelect" style="margin-top:8px">
              <option value="">請先選擇活動</option>
            </select>
          </div>

          <div class="field" id="checkinCodeWrap">
            <label for="checkinCode">現場簽到驗證碼（6 位數字）</label>
            <input type="text" id="checkinCode" class="mono" inputmode="numeric" maxlength="6" placeholder="見管理頁或看板 QR 下方" autocomplete="one-time-code" style="max-width:220px;letter-spacing:0.12em;font-size:1.05rem">
            <div id="checkinCodeHint" class="hint">若活動有設定驗證碼則必填；未設定之活動可留空。</div>
          </div>

          <div class="field">
            <label>動作</label>
            <div class="row checkinActionRow">
              <button type="button" id="btnIn">簽到</button>
              <button type="button" id="btnOut" class="secondary">簽退</button>
            </div>
            <div id="checkinGateStatus" class="pill openStatusPill" style="display:none" role="status" aria-live="polite"></div>
            <div class="hint">選好動作後，往左滑到底就會送出。</div>
          </div>

          <div class="slideWrap">
            <div class="slideLabel">
              <div class="pill"><span class="dot" id="actionDot"></span><span id="actionText">尚未選擇動作</span></div>
              <div class="badge mono" id="serverTime"></div>
            </div>
            <div class="slideBar" id="slideBar">
              <div class="slideText" id="slideHint">往左滑動確認</div>
              <div class="thumb" id="thumb" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="輸入驗證碼後往左滑到底以確認簽到或簽退；亦可用 Enter 送出" aria-busy="false">滑動</div>
            </div>
            <div class="toast" id="toast" role="status" aria-live="polite"></div>
          </div>
        </div>

        <div class="card">
          <h2>目前狀態</h2>
          <div id="statusBox" class="hint">請先選擇活動與姓名。</div>
          <div style="margin-top:12px" class="hint">若出現「尚未開放」，請通知管理員在管理頁點選「開放簽到」。</div>
        </div>
      </div>
    </div>
    </div>

    <?!= include('app.js'); ?>
    <script>
      const BOOT = <?= JSON.stringify(bootstrap) ?>;
      /** 由 `google.script.url.getLocation` 填入外層網址之列 `eventId`（Iframe 內用）。 */
      var __gasLockedEventId = '';
      function readParamFromGasUrlLoc_(loc, key){
        try {
          if (!loc) return '';
          var p = loc.parameter || {};
          if (p[key] != null && String(p[key]).trim() !== '') return String(p[key]).trim();
          var arr = loc.parameters && loc.parameters[key];
          if (Array.isArray(arr) && arr.length && arr[0] != null) {
            var v = String(arr[0]).trim();
            if (v) return v;
          }
        } catch (_e) {}
        return '';
      }
      function bootstrapCheckinFromGasUrl_(done){
        function finish(ev){
          __gasLockedEventId = String(ev || '').trim();
          if (typeof done === 'function') done();
        }
        if (typeof google === 'undefined' || !google.script || !google.script.url || typeof google.script.url.getLocation !== 'function') {
          finish('');
          return;
        }
        try {
          google.script.url.getLocation(function(loc){
            finish(readParamFromGasUrlLoc_(loc, 'eventId'));
          });
        } catch (_e2) {
          finish('');
        }
      }
      function getExecContextSearchParams(){
        function mergeFromUrl(params, urlStr){
          try {
            var u = new URL(String(urlStr || ''), 'https://script.google.com');
            var s = u.searchParams;
            ['eventId', 'page'].forEach(function(k){
              var v = s.get(k);
              if (v != null && String(v).trim() !== '') params.set(k, String(v).trim());
            });
          } catch (_e) {}
        }
        try {
          var acc = new URLSearchParams();
          mergeFromUrl(acc, String(window.location && window.location.href || ''));
          mergeFromUrl(acc, String(document.referrer || ''));
          return acc;
        } catch (_e2) {
          return new URLSearchParams();
        }
      }
      function getEffectiveLockedEventId(){
        var b = String(BOOT.eventId || '').trim();
        if (b) return b;
        if (String(__gasLockedEventId || '').trim()) return String(__gasLockedEventId).trim();
        try {
          return String(getExecContextSearchParams().get('eventId') || '').trim();
        } catch (_e) {
          return '';
        }
      }
      function checkinCodeStorageKey(eventId){
        return 'checkinCode_' + String(eventId || '').trim();
      }
      function getEffectiveCheckinCode(){
        var inp = $('#checkinCode');
        var raw = inp ? String(inp.value || '').replace(/\D/g, '') : '';
        return raw.slice(0, 6);
      }
      function persistCheckinCode(){
        var ev = $('#eventSelect').value.trim();
        var c = getEffectiveCheckinCode();
        if (!ev) return;
        try {
          if (c) sessionStorage.setItem(checkinCodeStorageKey(ev), c);
          else sessionStorage.removeItem(checkinCodeStorageKey(ev));
        } catch (_e) {}
      }
      function loadPersistedCheckinCodeIntoField(){
        var ev = $('#eventSelect').value.trim();
        var inp = $('#checkinCode');
        if (!inp) return;
        if (!ev) {
          inp.value = '';
          return;
        }
        try {
          var s = String(sessionStorage.getItem(checkinCodeStorageKey(ev)) || '').replace(/\D/g, '').slice(0, 6);
          inp.value = s || '';
        } catch (_e) {
          inp.value = '';
        }
      }
      function clearCheckinCodeStorage(eventId){
        var eid = String(eventId || '').trim();
        if (!eid) return;
        try {
          sessionStorage.removeItem(checkinCodeStorageKey(eid));
        } catch (_e) {}
      }
      function getSelectedEventRequiresCheckinCode(){
        var id = $('#eventSelect').value.trim();
        if (!id) return false;
        var list = window.__checkinEventsList || [];
        var h = list.find(function(e){ return e.eventId === id; });
        return !!(h && h.requiresCheckinCode === true);
      }
      function updateCheckinCodeHintUi(){
        var hint = $('#checkinCodeHint');
        if (!hint) return;
        if (getSelectedEventRequiresCheckinCode()) {
          hint.textContent = '此活動已設定驗證碼：請輸入 6 位數字後再載入名單與滑動簽到。';
        } else {
          hint.textContent = '此活動未設定驗證碼，可留空。';
        }
      }
      function isLikelyCheckinCodeAuthError_(msg){
        var s = String(msg || '');
        return s.indexOf('驗證碼') !== -1 || s.indexOf('checkinToken') !== -1 || s.indexOf('密鑰') !== -1 || s.indexOf('存取密鑰') !== -1;
      }
      document.getElementById('topNav').appendChild(renderTopbarNav(BOOT));
      refreshNavExecBaseFromServer(BOOT);
      let action = null; // IN | OUT
      let busy = false;
      let ROSTER_FULL = [];
      let checkinToastTimer = null;

      function setToast(msg, opts){
        const el = $('#toast');
        if (!el) return;
        if (checkinToastTimer) {
          clearTimeout(checkinToastTimer);
          checkinToastTimer = null;
        }
        el.textContent = msg || '';
        const err = !!(opts && opts.error);
        el.classList.toggle('toast--error', err);
        el.setAttribute('role', err ? 'alert' : 'status');
        if (!msg) return;
        const clearMs = opts && Object.prototype.hasOwnProperty.call(opts, 'clearMs')
          ? opts.clearMs
          : (err ? null : 3800);
        if (clearMs != null && clearMs > 0) {
          checkinToastTimer = setTimeout(function(){
            el.textContent = '';
            el.classList.remove('toast--error');
            el.setAttribute('role', 'status');
            checkinToastTimer = null;
          }, clearMs);
        }
      }

      function setCheckinSubmittingUi(is){
        const inEl = $('#btnIn');
        const outEl = $('#btnOut');
        const thumb = $('#thumb');
        const bar = $('#slideBar');
        if (inEl) inEl.disabled = is;
        if (outEl) outEl.disabled = is;
        if (thumb) {
          thumb.setAttribute('aria-busy', is ? 'true' : 'false');
          thumb.classList.toggle('is-busy', is);
        }
        if (bar) bar.classList.toggle('is-busy', is);
      }

      function styleCheckinActionButtons(){
        const inEl = $('#btnIn');
        const outEl = $('#btnOut');
        if (!inEl || !outEl) return;
        inEl.classList.remove('action-selected-in', 'action-unselected');
        outEl.classList.remove('action-selected-out', 'action-unselected', 'secondary');
        if (action === 'IN') {
          inEl.classList.add('action-selected-in');
          outEl.classList.add('action-unselected');
        } else if (action === 'OUT') {
          outEl.classList.add('action-selected-out');
          inEl.classList.add('action-unselected');
        } else {
          outEl.classList.add('secondary');
        }
      }

      function getCheckinSelectedEventOpen(){
        const id = $('#eventSelect').value.trim();
        if (!id) return null;
        const list = window.__checkinEventsList || [];
        const h = list.find(function(e){ return e.eventId === id; });
        return h ? !!h.isOpen : null;
      }

      function syncCheckinInteractiveDisabled(){
        if (busy) return;
        const id = $('#eventSelect').value.trim();
        const open = getCheckinSelectedEventOpen();
        var gatedOff = !!id && open === false;
        var needCode = getSelectedEventRequiresCheckinCode();
        var codeOk = !needCode || getEffectiveCheckinCode().length === 6;
        var gatedCode = !!id && needCode && !codeOk;
        var block = gatedOff || gatedCode;
        var inEl = $('#btnIn');
        var outEl = $('#btnOut');
        var thumb = $('#thumb');
        var bar = $('#slideBar');
        var hint = $('#slideHint');
        if (inEl) inEl.disabled = block;
        if (outEl) outEl.disabled = block;
        if (thumb) {
          thumb.setAttribute('aria-disabled', block ? 'true' : 'false');
          thumb.tabIndex = block ? -1 : 0;
          thumb.style.pointerEvents = block ? 'none' : '';
        }
        if (bar) {
          bar.classList.toggle('is-gated', block);
          bar.setAttribute('aria-disabled', block ? 'true' : 'false');
        }
        if (hint) {
          if (gatedOff) hint.textContent = '活動尚未開放簽到';
          else if (gatedCode) hint.textContent = '請先輸入 6 位驗證碼';
          else hint.textContent = '往左滑動確認';
        }
      }

      function updateCheckinGateStatusUi(){
        const badge = $('#checkinGateStatus');
        if (!badge) return;
        const id = $('#eventSelect').value.trim();
        if (!id) {
          badge.style.display = 'none';
          badge.innerHTML = '';
          syncCheckinInteractiveDisabled();
          return;
        }
        const open = getCheckinSelectedEventOpen();
        badge.style.display = 'inline-flex';
        if (open) {
          badge.innerHTML = '<span class="dot ok"></span><span>本活動管理狀態：<strong>開放簽到</strong></span>';
        } else {
          badge.innerHTML = '<span class="dot not"></span><span>本活動管理狀態：<strong>尚未開放簽到</strong></span>';
        }
        syncCheckinInteractiveDisabled();
      }

      function setAction(next){
        action = next;
        $('#actionText').textContent = next === 'IN' ? '即將簽到' : next === 'OUT' ? '即將簽退' : '尚未選擇動作';
        const dot = $('#actionDot');
        dot.className = 'dot ' + (next === 'IN' ? 'ok' : next === 'OUT' ? 'warn' : '');
        styleCheckinActionButtons();
      }

      function applyPersonFilter(q){
        const sel = $('#personSelect');
        const norm = function(s){ return String(s || '').toLowerCase(); };
        const qq = norm(q);
        const list = !qq ? ROSTER_FULL.slice() : ROSTER_FULL.filter(function(p){ return norm(p.displayName).indexOf(qq) !== -1; });
        const cur = sel.value;
        sel.innerHTML = '<option value=\"\">請選擇</option>' + list.map(function(p){
          return '<option value=\"' + esc(p.personId) + '\">' + esc(p.displayName) + '</option>';
        }).join('');
        if (cur && list.some(function(p){ return p.personId === cur; })) sel.value = cur;
      }

      async function refreshRoster(){
        const eventId = $('#eventSelect').value.trim();
        if (!eventId){
          ROSTER_FULL = [];
          $('#personSelect').innerHTML = '<option value=\"\">請先選擇活動</option>';
          return;
        }
        try {
          const roster = await api('publicListRoster', eventId, getEffectiveCheckinCode());
          ROSTER_FULL = Array.isArray(roster) ? roster : [];
          applyPersonFilter(($('#personSearch').value || '').trim());
        } catch (e) {
          ROSTER_FULL = [];
          $('#personSelect').innerHTML = '<option value=\"\">名單載入失敗</option>';
          var msg = formatApiError(e);
          if (isLikelyCheckinCodeAuthError_(msg)) {
            clearCheckinCodeStorage(eventId);
            var inp = $('#checkinCode');
            if (inp) inp.value = '';
            setToast('驗證碼錯誤或已更新，請重新輸入。', { error: true });
          } else {
            setToast(msg, { error: true });
          }
        }
      }

      async function loadEventsCheckin(){
        const sel = $('#eventSelect');
        const hint = $('#eventHint');
        const locked = getEffectiveLockedEventId();
        try {
          const raw = await api('publicListBoardEvents');
          const events = (raw && raw.events) ? raw.events : [];
          window.__checkinEventsList = events;
          sel.innerHTML = '<option value=\"\">請選擇活動</option>' + events.map(function(e){
            const label = (e.name || e.eventId);
            return '<option value=\"' + esc(e.eventId) + '\">' + esc(label) + '</option>';
          }).join('');
          if (locked) {
            if (events.some(function(x){ return x.eventId === locked; })) {
              sel.value = locked;
              sel.disabled = true;
              hint.textContent = '已由簽到連結或 QR Code 指定活動。';
            } else {
              hint.textContent = '連結中的活動不存在、尚未開放簽到（未列入選單）或已停用，請改選下方活動或洽管理員。';
              sel.disabled = false;
            }
          } else {
            if (events.length === 1) {
              sel.value = String(events[0].eventId || '').trim();
            }
            hint.textContent = events.length ? '請選擇要簽到的活動。' : '尚無活動：請管理員於後台「建立活動」後再試。';
            sel.disabled = false;
          }
          loadPersistedCheckinCodeIntoField();
          updateCheckinCodeHintUi();
          updateCheckinGateStatusUi();
          await refreshRoster();
          await refreshStatus();
        } catch (e) {
          sel.innerHTML = '<option value=\"\">載入失敗</option>';
          hint.textContent = '無法載入活動清單：' + formatApiError(e);
          window.__checkinEventsList = [];
          updateCheckinGateStatusUi();
        }
      }

      async function refreshStatus(){
        const eventId = $('#eventSelect').value.trim();
        const personId = $('#personSelect').value;
        if (!eventId || !personId){ $('#statusBox').textContent = '請先選擇活動與姓名。'; return; }
        try {
          const s = await api('publicGetPersonStatus', eventId, personId, getEffectiveCheckinCode());
          if (!s || typeof s !== 'object') {
            $('#statusBox').textContent = '無法讀取狀態，請重新整理頁面。';
            return;
          }
          $('#statusBox').innerHTML = `
            <div class="pill"><span class="dot ${s.status==='IN'?'ok':(s.status==='OUT'?'bad':'')}"></span>
              <span>${esc(s.statusLabel)}</span>
            </div>
            <div style="margin-top:10px" class="hint">最後時間：<span class="mono">${esc(s.lastTime ? fmtTs(s.lastTime) : '—')}</span></div>
          `;
        } catch (e) {
          var msg = formatApiError(e);
          if (isLikelyCheckinCodeAuthError_(msg)) {
            clearCheckinCodeStorage(eventId);
            var inp2 = $('#checkinCode');
            if (inp2) inp2.value = '';
            syncCheckinInteractiveDisabled();
          }
          $('#statusBox').innerHTML = '<div class="banner-error" style="display:block">' + esc(msg) + '</div>';
        }
      }

      async function submit(){
        if (busy) return;
        const eventId = $('#eventSelect').value.trim();
        const personId = $('#personSelect').value;
        if (!eventId) return setToast('請選擇活動。', { clearMs: 3200 });
        if (!personId) return setToast('請先選擇姓名。', { clearMs: 3200 });
        if (!action) return setToast('請先選擇「簽到」或「簽退」。', { clearMs: 3200 });
        if (getSelectedEventRequiresCheckinCode() && getEffectiveCheckinCode().length !== 6) {
          return setToast('請先輸入管理頁或看板 QR 下方顯示的 6 位驗證碼。', { clearMs: 4000 });
        }
        busy = true;
        setCheckinSubmittingUi(true);
        setToast('送出中…', { clearMs: null });
        try{
          const res = await api('publicSubmitAttendance', { eventId, personId, action, font: '', token: getEffectiveCheckinCode(), clientMeta: { ua:navigator.userAgent } });
          var st = (res && res.serverTime != null && String(res.serverTime) !== '') ? String(res.serverTime) : '';
          $('#serverTime').textContent = st ? ('伺服器時間 ' + fmtTs(st)) : '';
          setToast(action === 'IN' ? '簽到完成' : '簽退完成', { clearMs: 3800 });
          await refreshStatus();
        }catch(e){
          var em = formatApiError(e);
          if (isLikelyCheckinCodeAuthError_(em)) {
            clearCheckinCodeStorage(eventId);
            var inp3 = $('#checkinCode');
            if (inp3) inp3.value = '';
            setToast('驗證碼錯誤或已更新，請重新輸入。', { error: true });
            syncCheckinInteractiveDisabled();
          } else {
            setToast(em, { error: true });
          }
        }finally{
          busy = false;
          setCheckinSubmittingUi(false);
          syncCheckinInteractiveDisabled();
        }
      }

      function initSlide(){
        const bar = $('#slideBar');
        const thumb = $('#thumb');
        let dragging = false;
        let startX = 0;
        let startRight = 6;

        function trackReady(){
          var w = bar.clientWidth;
          var tw = thumb.clientWidth;
          return w > 0 && tw > 0 && w >= tw + 12;
        }

        function setRight(px){
          var maxRight = 6;
          if (!trackReady()) {
            thumb.style.right = maxRight + 'px';
            return maxRight;
          }
          var minRight = bar.clientWidth - thumb.clientWidth - 6;
          if (minRight >= maxRight) {
            thumb.style.right = maxRight + 'px';
            return maxRight;
          }
          var r = Math.max(minRight, Math.min(maxRight, px));
          thumb.style.right = r + 'px';
          return r;
        }
        function reset(){ thumb.style.right = '6px'; }

        function onSlideBarResize(){
          if (dragging) return;
          reset();
        }
        if (typeof ResizeObserver !== 'undefined' && bar) {
          try {
            var ro = new ResizeObserver(function(){ onSlideBarResize(); });
            ro.observe(bar);
          } catch (_e) {}
        }
        window.addEventListener('resize', onSlideBarResize);

        function onDown(ev){
          if (busy) return;
          dragging = true;
          startX = (ev.touches ? ev.touches[0].clientX : ev.clientX);
          const right = parseFloat(getComputedStyle(thumb).right) || 6;
          startRight = right;
          ev.preventDefault();
        }
        async function onMove(ev){
          if (!dragging) return;
          const x = (ev.touches ? ev.touches[0].clientX : ev.clientX);
          const dx = x - startX;
          const right = setRight(startRight - dx);
          if (trackReady()) {
            const minRight = bar.clientWidth - thumb.clientWidth - 6;
            if (right <= minRight + 2){
              dragging = false;
              await submit();
              reset();
            }
          }
          ev.preventDefault();
        }
        function onUp(){ dragging = false; }

        thumb.addEventListener('keydown', function(ev){
          if (busy) return;
          if (ev.key === 'Enter' || ev.key === ' ') {
            ev.preventDefault();
            void submit();
          }
        });
        thumb.addEventListener('mousedown', onDown);
        thumb.addEventListener('touchstart', onDown, { passive:false });
        window.addEventListener('mousemove', onMove, { passive:false });
        window.addEventListener('touchmove', onMove, { passive:false });
        window.addEventListener('mouseup', onUp);
        window.addEventListener('touchend', onUp);
      }

      $('#btnIn').addEventListener('click', () => setAction('IN'));
      $('#btnOut').addEventListener('click', () => setAction('OUT'));
      $('#eventSelect').addEventListener('change', async () => {
        $('#personSearch').value = '';
        loadPersistedCheckinCodeIntoField();
        updateCheckinCodeHintUi();
        updateCheckinGateStatusUi();
        styleCheckinActionButtons();
        try {
          await refreshRoster();
          await refreshStatus();
        } catch (_e) {}
        syncCheckinInteractiveDisabled();
      });
      var checkinCodeEl = $('#checkinCode');
      if (checkinCodeEl) {
        checkinCodeEl.addEventListener('input', function(){
          var v = String(checkinCodeEl.value || '').replace(/\D/g, '').slice(0, 6);
          if (checkinCodeEl.value !== v) checkinCodeEl.value = v;
          persistCheckinCode();
          syncCheckinInteractiveDisabled();
        });
      }
      $('#personSearch').addEventListener('input', function(){
        applyPersonFilter(($('#personSearch').value || '').trim());
      });
      $('#personSelect').addEventListener('change', function(){ void refreshStatus(); });

      setAction(null);
      initSlide();
      bootstrapCheckinFromGasUrl_(function(){
        void loadEventsCheckin();
      });
    </script>
  </body>
</html>
