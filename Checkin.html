    <script>
      const BOOT = <?= JSON.stringify(bootstrap) ?>;
      var __gasLockedEventId = '';
      var __urlCheckinCode = '';

      function readParamFromGasUrlLoc_(loc, key){
        try {
          if (!loc) return '';
          var p = loc.parameter || {};
          if (p[key] != null && String(p[key]).trim() !== '') return String(p[key]).trim();
          var arr = loc.parameters && loc.parameters[key];
          if (Array.isArray(arr) && arr.length && arr[0] != null) {
            var v = String(arr[0]).trim();
            if (v) return v;
          }
        } catch (_e) {}
        return '';
      }

      function bootstrapCheckinFromGasUrl_(done){
        function finish(ev, cCode){
          __gasLockedEventId = String(ev || '').trim();
          if (cCode) __urlCheckinCode = String(cCode).replace(/\D/g, '').slice(0, 6);
          if (typeof done === 'function') done();
        }
        if (typeof google === 'undefined' || !google.script || !google.script.url || typeof google.script.url.getLocation !== 'function') {
          finish('', '');
          return;
        }
        try {
          google.script.url.getLocation(function(loc){
            var eid = readParamFromGasUrlLoc_(loc, 'eventId');
            var c = readParamFromGasUrlLoc_(loc, 'c') || readParamFromGasUrlLoc_(loc, 'checkinToken');
            finish(eid, c);
          });
        } catch (_e2) {
          finish('', '');
        }
      }

      function getExecContextSearchParams(){
        function mergeFromUrl(params, urlStr){
          try {
            var u = new URL(String(urlStr || ''), 'https://script.google.com');
            var s = u.searchParams;
            ['eventId', 'page', 'c', 'checkinToken'].forEach(function(k){
              var v = s.get(k);
              if (v != null && String(v).trim() !== '') params.set(k, String(v).trim());
            });
          } catch (_e) {}
        }
        try {
          var acc = new URLSearchParams();
          mergeFromUrl(acc, String(window.location && window.location.href || ''));
          mergeFromUrl(acc, String(document.referrer || ''));
          return acc;
        } catch (_e2) {
          return new URLSearchParams();
        }
      }

      function getEffectiveLockedEventId(){
        var b = String(BOOT.eventId || '').trim();
        if (b) return b;
        if (String(__gasLockedEventId || '').trim()) return String(__gasLockedEventId).trim();
        try {
          return String(getExecContextSearchParams().get('eventId') || '').trim();
        } catch (_e) {
          return '';
        }
      }

      function getDirectUrlCheckinCode(){
        if (__urlCheckinCode) return __urlCheckinCode;
        if (BOOT && (BOOT.checkinCode || BOOT.checkinToken)) {
          return String(BOOT.checkinCode || BOOT.checkinToken).replace(/\D/g, '').slice(0, 6);
        }
        try {
          var sp = getExecContextSearchParams();
          var c = sp.get('c') || sp.get('checkinToken');
          if (c) return String(c).replace(/\D/g, '').slice(0, 6);
        } catch (_e) {}
        return '';
      }

      function checkinCodeStorageKey(eventId){
        return 'checkinCode_' + String(eventId || '').trim();
      }

      function getEffectiveCheckinCode(){
        var inp = $('#checkinCode');
        var raw = inp ? String(inp.value || '').replace(/\D/g, '') : '';
        return raw.slice(0, 6);
      }

      function getCheckinTokenForApi(){
        if (!getSelectedEventRequiresCheckinCode()) return '';
        return getEffectiveCheckinCode();
      }

      function persistCheckinCode(){
        var ev = $('#eventSelect').value.trim();
        var c = getEffectiveCheckinCode();
        if (!ev) return;
        try {
          if (c) sessionStorage.setItem(checkinCodeStorageKey(ev), c);
          else sessionStorage.removeItem(checkinCodeStorageKey(ev));
        } catch (_e) {}
      }

      function loadPersistedCheckinCodeIntoField(){
        var ev = $('#eventSelect').value.trim();
        var inp = $('#checkinCode');
        if (!inp) return;
        if (!ev) {
          inp.value = '';
          return;
        }
        var directCode = getDirectUrlCheckinCode();
        if (directCode && directCode.length === 6) {
          inp.value = directCode;
          persistCheckinCode();
          return;
        }
        try {
          var s = String(sessionStorage.getItem(checkinCodeStorageKey(ev)) || '').replace(/\D/g, '').slice(0, 6);
          inp.value = s || '';
        } catch (_e) {
          inp.value = '';
        }
      }

      function clearCheckinCodeStorage(eventId){
        var eid = String(eventId || '').trim();
        if (!eid) return;
        try {
          sessionStorage.removeItem(checkinCodeStorageKey(eid));
        } catch (_e) {}
      }

      function getSelectedEventMeta(){
        var id = $('#eventSelect').value.trim();
        if (!id) return null;
        var list = window.__checkinEventsList || [];
        return list.find(function(e){ return e.eventId === id; }) || null;
      }

      function getSelectedEventRequiresCheckinCode(){
        var h = getSelectedEventMeta();
        if (!h) return false;
        var v = h.requiresCheckinCode;
        if (v === true || v === 1) return true;
        if (typeof v === 'string') {
          var s = v.trim().toLowerCase();
          return s === 'true' || s === '1';
        }
        return false;
      }

      function updateCheckinCodeHintUi(){
        var wrap = $('#checkinCodeWrap');
        var hint = $('#checkinCodeHint');
        var need = getSelectedEventRequiresCheckinCode();
        var directCode = getDirectUrlCheckinCode();
        if (wrap) {
          // 若由 URL 直通且已填妥正確驗證碼，收合顯示以維持簡潔
          if (need && directCode && directCode.length === 6) {
            wrap.style.display = 'none';
          } else {
            wrap.style.display = need ? '' : 'none';
          }
        }
        if (!need) {
          var inpClear = $('#checkinCode');
          if (inpClear) inpClear.value = '';
        }
        if (!hint) return;
        if (need) {
          hint.textContent = '此活動已設定驗證碼：請輸入 6 位數字後載入名單並完成簽到。';
        } else {
          hint.textContent = '此活動未設定現場驗證碼，不需填寫。';
        }
      }

      function isLikelyCheckinCodeAuthError_(msg){
        var s = String(msg || '');
        if (s.indexOf('未於後台設定') !== -1) return false;
        return s.indexOf('驗證碼') !== -1 || s.indexOf('checkinToken') !== -1 || s.indexOf('密鑰') !== -1 || s.indexOf('存取密鑰') !== -1;
      }

      document.getElementById('topNav').appendChild(renderTopbarNav(BOOT));
      document.getElementById('themeToggleHost').appendChild(renderThemeToggle());
      refreshNavExecBaseFromServer(BOOT);

      let action = 'IN'; // 預設為簽到 IN
      let busy = false;
      let ROSTER_FULL = [];
      let checkinToastTimer = null;
      let rosterReqSeq = 0;
      let statusReqSeq = 0;
      let currentPersonMeta = null; // { hasPassword, requirePassword, allowChangePassword }

      function setToast(msg, opts){
        const el = $('#toast');
        if (!el) return;
        if (checkinToastTimer) {
          clearTimeout(checkinToastTimer);
          checkinToastTimer = null;
        }
        el.textContent = msg || '';
        const err = !!(opts && opts.error);
        el.classList.toggle('toast--error', err);
        el.setAttribute('role', err ? 'alert' : 'status');
        if (!msg) return;
        const clearMs = opts && Object.prototype.hasOwnProperty.call(opts, 'clearMs')
          ? opts.clearMs
          : (err ? 6000 : 3800);
        if (clearMs != null && clearMs > 0) {
          checkinToastTimer = setTimeout(function(){
            el.textContent = '';
            el.classList.remove('toast--error');
            el.setAttribute('role', 'status');
            checkinToastTimer = null;
          }, clearMs);
        }
      }

      function setCheckinSubmittingUi(is){
        const subBtn = $('#btnSubmitCheckin');
        const hintEl = $('#submitStatusHint');

        // 僅鎖定送出大按鈕，嚴格禁止鎖定其餘輸入欄位（#btnIn, #btnOut, #personSearch, #personSelect 保持解鎖）
        if (subBtn) {
          subBtn.disabled = is;
          if (is) {
            subBtn.classList.add('is-submitting');
            subBtn.innerHTML = '<span class="btn-spinner"></span><span id="btnSubmitText">' + (action === 'IN' ? '簽到送出中…' : '簽退送出中…') + '</span>';
          } else {
            subBtn.classList.remove('is-submitting');
            subBtn.innerHTML = '<span id="btnSubmitText">' + (action === 'IN' ? '確認簽到' : '確認簽退') + '</span>';
          }
        }

        if (hintEl) {
          if (is) {
            hintEl.className = 'submitStatusHint is-sending';
            hintEl.textContent = '⏳ 正在傳送至伺服器，請稍候…';
            hintEl.style.display = 'block';
          } else if (hintEl.classList.contains('is-sending')) {
            hintEl.style.display = 'none';
            hintEl.textContent = '';
            hintEl.className = 'submitStatusHint';
          }
        }
      }

      function styleCheckinActionButtons(){
        const inEl = $('#btnIn');
        const outEl = $('#btnOut');
        const subBtn = $('#btnSubmitCheckin');
        const subText = $('#btnSubmitText');
        const actionDot = $('#actionDot');
        const actionText = $('#actionText');
        if (!inEl || !outEl) return;

        const isIn = (action === 'IN');

        // 對稱 toggle 簽到按鈕：IN 時加 action-selected-in 移 secondary 與 action-unselected；OUT 則反向
        inEl.classList.toggle('action-selected-in', isIn);
        inEl.classList.toggle('action-unselected', !isIn);
        inEl.classList.toggle('secondary', !isIn);

        // 對稱 toggle 簽退按鈕：OUT 時加 action-selected-out 移 secondary 與 action-unselected；IN 則反向
        outEl.classList.toggle('action-selected-out', !isIn);
        outEl.classList.toggle('action-unselected', isIn);
        outEl.classList.toggle('secondary', isIn);

        // 送出大按鈕主題同步
        if (subBtn) {
          subBtn.classList.toggle('in', isIn);
          subBtn.classList.toggle('out', !isIn);
        }
        if (subText && !busy) {
          subText.textContent = isIn ? '確認簽到' : '確認簽退';
        }

        // 狀態指示燈與文字同步
        if (actionDot) {
          actionDot.className = isIn ? 'dot ok' : 'dot warn';
        }
        if (actionText) {
          actionText.textContent = isIn ? '即將簽到' : '即將簽退';
        }
      }

      function getCheckinSelectedEventOpen(){
        var meta = getSelectedEventMeta();
        return meta ? !!meta.isOpen : null;
      }

      function syncCheckinInteractiveDisabled(){
        if (busy) return;
        const id = $('#eventSelect').value.trim();
        const open = getCheckinSelectedEventOpen();
        var gatedOff = !!id && open === false;
        var needCode = getSelectedEventRequiresCheckinCode();
        var codeOk = !needCode || getEffectiveCheckinCode().length === 6;
        var gatedCode = !!id && needCode && !codeOk;
        var block = gatedOff || gatedCode;

        var inEl = $('#btnIn');
        var outEl = $('#btnOut');
        var subBtn = $('#btnSubmitCheckin');
        if (inEl) inEl.disabled = block;
        if (outEl) outEl.disabled = block;
        if (subBtn) {
          subBtn.disabled = block;
        }
      }

      function updateCheckinGateStatusUi(){
        const badge = $('#checkinGateStatus');
        if (!badge) return;
        const id = $('#eventSelect').value.trim();
        if (!id) {
          badge.style.display = 'none';
          badge.innerHTML = '';
          syncCheckinInteractiveDisabled();
          return;
        }
        const open = getCheckinSelectedEventOpen();
        badge.style.display = 'inline-flex';
        if (open) {
          badge.innerHTML = '<span class="dot ok"></span><span>活動狀態：<strong>開放簽到中</strong></span>';
        } else {
          badge.innerHTML = '<span class="dot not"></span><span>活動狀態：<strong>尚未開放簽到</strong></span>';
        }
        syncCheckinInteractiveDisabled();
      }

      function setAction(next){
        action = next || 'IN';
        styleCheckinActionButtons();
      }

      function applyPersonFilter(q){
        const sel = $('#personSelect');
        const norm = function(s){ return String(s || '').toLowerCase(); };
        const qq = norm(q);
        const list = !qq ? ROSTER_FULL.slice() : ROSTER_FULL.filter(function(p){ return norm(p.displayName).indexOf(qq) !== -1; });
        const cur = sel.value;
        sel.innerHTML = '<option value="">請選擇姓名</option>' + list.map(function(p){
          return '<option value="' + esc(p.personId) + '">' + esc(p.displayName) + '</option>';
        }).join('');
        if (cur && list.some(function(p){ return p.personId === cur; })) {
          sel.value = cur;
        } else if (qq && list.length === 1) {
          // 當搜尋精準匹配唯一結果時，自動選定
          sel.value = list[0].personId;
          void refreshStatus();
        } else {
          var badge = $('#statusBadge');
          if (badge) badge.style.display = 'none';
        }
        syncCheckinInteractiveDisabled();
      }

      async function refreshRoster(){
        const eventId = $('#eventSelect').value.trim();
        const mySeq = ++rosterReqSeq;
        if (!eventId){
          ROSTER_FULL = [];
          $('#personSelect').innerHTML = '<option value="">請先選擇活動</option>';
          return;
        }
        const needCode = getSelectedEventRequiresCheckinCode();
        const codeLen = getEffectiveCheckinCode().length;
        if (needCode && codeLen !== 6) {
          ROSTER_FULL = [];
          $('#personSelect').innerHTML = '<option value="">請先輸入 6 位驗證碼以載入名單</option>';
          return;
        }
        try {
          const roster = await api('publicListRoster', eventId, getCheckinTokenForApi());
          if (mySeq !== rosterReqSeq) return;
          ROSTER_FULL = Array.isArray(roster) ? roster : [];
          applyPersonFilter(($('#personSearch').value || '').trim());
        } catch (e) {
          if (mySeq !== rosterReqSeq) return;
          ROSTER_FULL = [];
          $('#personSelect').innerHTML = '<option value="">名單載入失敗</option>';
          var msg = formatApiError(e);
          if (isLikelyCheckinCodeAuthError_(msg)) {
            clearCheckinCodeStorage(eventId);
            var inp = $('#checkinCode');
            if (inp) inp.value = '';
            setToast('驗證碼錯誤或已更新，請重新輸入。', { error: true });
          } else {
            setToast(msg, { error: true });
          }
        }
      }

      async function loadEventsCheckin(){
        const sel = $('#eventSelect');
        const hint = $('#eventHint');
        const locked = getEffectiveLockedEventId();
        try {
          const raw = await api('publicListBoardEvents');
          const events = (raw && raw.events) ? raw.events : [];
          window.__checkinEventsList = events;
          sel.innerHTML = '<option value="">請選擇活動</option>' + events.map(function(e){
            const label = (e.name || e.eventId);
            return '<option value="' + esc(e.eventId) + '">' + esc(label) + '</option>';
          }).join('');

          if (locked) {
            if (events.some(function(x){ return x.eventId === locked; })) {
              sel.value = locked;
              sel.disabled = true;
              hint.textContent = '已由簽到連結或 QR Code 指定活動。';
            } else {
              hint.textContent = '連結中的活動不存在、尚未開放簽到或已停用，請改選下方活動或洽管理員。';
              sel.disabled = false;
            }
          } else {
            if (events.length === 1) {
              sel.value = String(events[0].eventId || '').trim();
            }
            hint.textContent = events.length ? '請選擇要簽到的活動。' : '尚無活動：請管理員於後台「建立活動」後再試。';
            sel.disabled = false;
          }

          loadPersistedCheckinCodeIntoField();
          updateCheckinCodeHintUi();
          updateCheckinGateStatusUi();

          if (BOOT && Array.isArray(BOOT.initialRoster) && BOOT.initialRoster.length > 0 && sel.value === BOOT.eventId) {
            ROSTER_FULL = BOOT.initialRoster;
            applyPersonFilter(($('#personSearch').value || '').trim());
            await refreshStatus();
          } else {
            await Promise.all([refreshRoster(), refreshStatus()]);
          }

          // URL 直通或已選活動時，自動聚焦姓名搜尋框（省略點擊鍵盤直接跳出）
          setTimeout(function(){
            var ps = $('#personSearch');
            if (ps) {
              try { ps.focus(); } catch (_e) {}
            }
          }, 150);

        } catch (e) {
          sel.innerHTML = '<option value="">載入失敗</option>';
          hint.textContent = '無法載入活動清單：' + formatApiError(e);
          window.__checkinEventsList = [];
          updateCheckinGateStatusUi();
        }
      }

      function fmtTimeOnly_(ts){
        if (!ts) return '';
        var d = new Date(ts);
        if (isNaN(d.getTime())) return '';
        var h = String(d.getHours()).padStart(2, '0');
        var m = String(d.getMinutes()).padStart(2, '0');
        return h + ':' + m;
      }

      function renderStatusBox_(status, statusLabel, lastTime){
        var badge = $('#statusBadge');
        var dot = $('#statusDot');
        var text = $('#statusLabelText');
        var sel = $('#personSelect');
        var personId = sel ? sel.value : '';
        if (!badge || !dot || !text) return;
        if (!personId) {
          badge.style.display = 'none';
          return;
        }
        var s = String(status || '').toUpperCase();
        var dotCls = s === 'IN' ? 'ok' : (s === 'OUT' ? 'warn' : '');
        dot.className = 'dot' + (dotCls ? (' ' + dotCls) : '');
        var timeStr = fmtTimeOnly_(lastTime);
        var label = '';
        if (s === 'IN') {
          label = '已簽到' + (timeStr ? (' ' + timeStr) : '');
        } else if (s === 'OUT') {
          label = '已簽退' + (timeStr ? (' ' + timeStr) : '');
        } else {
          label = '未簽到';
        }
        text.textContent = label;
        badge.style.display = 'inline-flex';
      }

      function updatePasswordUi(personMeta){
        const wrap = $('#personPasswordWrap');
        const hint = $('#personPasswordHint');
        const input = $('#personPassword');
        const btnChange = $('#btnOpenChangePwd');
        if (!wrap) return;

        if (!personMeta || !personMeta.requirePassword) {
          wrap.style.display = 'none';
          if (input) input.value = '';
          return;
        }

        wrap.style.display = 'block';
        if (personMeta.hasPassword) {
          if (hint) hint.textContent = '此活動已啟用個人密碼，請輸入個人簽到密碼。';
          if (input) input.placeholder = '請輸入個人簽到密碼';
          if (btnChange && personMeta.allowChangePassword) {
            btnChange.style.display = 'inline-block';
          }
        } else {
          if (hint) hint.textContent = '首次簽到：此活動要求個人密碼，請於下方自訂個人密碼（4~50字），將於初次簽到自動綁定。';
          if (input) input.placeholder = '請自訂個人密碼（初次自動綁定）';
          if (btnChange) btnChange.style.display = 'none';
        }
      }

      async function refreshStatus(){
        const eventId = $('#eventSelect').value.trim();
        const personId = $('#personSelect').value;
        const mySeq = ++statusReqSeq;
        const badge = $('#statusBadge');
        if (!eventId || !personId){
          if (badge) badge.style.display = 'none';
          updatePasswordUi(null);
          syncCheckinInteractiveDisabled();
          return;
        }
        try {
          const s = await api('publicGetPersonStatus', eventId, personId, getCheckinTokenForApi());
          if (mySeq !== statusReqSeq) return;
          if (!s || typeof s !== 'object') {
            if (badge) badge.style.display = 'none';
            return;
          }
          currentPersonMeta = {
            hasPassword: !!s.hasPassword,
            requirePassword: !!s.requirePassword,
            allowChangePassword: !!s.allowChangePassword,
          };
          updatePasswordUi(currentPersonMeta);
          renderStatusBox_(s.status, s.statusLabel, s.lastTime);
          syncCheckinInteractiveDisabled();
        } catch (e) {
          if (mySeq !== statusReqSeq) return;
          if (badge) badge.style.display = 'none';
          var msg = formatApiError(e);
          if (isLikelyCheckinCodeAuthError_(msg)) {
            clearCheckinCodeStorage(eventId);
            var inp2 = $('#checkinCode');
            if (inp2) inp2.value = '';
            syncCheckinInteractiveDisabled();
          }
          setToast(msg, { error: true });
        }
      }

      var __feedbackTimer = null;
      function showInPlaceSuccessFeedback(personName, submittedAction){
        const hintEl = $('#submitStatusHint');
        if (!hintEl) return;
        if (__feedbackTimer) {
          clearTimeout(__feedbackTimer);
          __feedbackTimer = null;
        }

        const actText = (submittedAction === 'IN') ? '簽到成功！' : '簽退成功！';
        const prefix = personName ? ('✅ 【' + esc(personName) + '】 ') : '✅ ';
        hintEl.className = 'submitStatusHint is-success';
        hintEl.innerHTML = prefix + actText;
        hintEl.style.display = 'block';

        __feedbackTimer = setTimeout(function(){
          if (hintEl && hintEl.classList.contains('is-success')) {
            hintEl.style.display = 'none';
            hintEl.textContent = '';
            hintEl.className = 'submitStatusHint';
          }
          __feedbackTimer = null;
        }, 1500);
      }

      function showSuccessModal(displayName, submittedAction, serverTime){
        showInPlaceSuccessFeedback(displayName, submittedAction);
      }

      function closeSuccessModalAndReset(){
        if (__feedbackTimer) {
          clearTimeout(__feedbackTimer);
          __feedbackTimer = null;
        }
        const modal = $('#checkinSuccessModal');
        if (modal) modal.classList.remove('open');

        // 快速復位供下一位使用
        const searchInput = $('#personSearch');
        const personSelect = $('#personSelect');
        const pwdInput = $('#personPassword');
        if (searchInput) {
          searchInput.value = '';
          applyPersonFilter('');
          try { searchInput.focus(); } catch (_e) {}
        }
        if (personSelect) personSelect.value = '';
        if (pwdInput) pwdInput.value = '';
        updatePasswordUi(null);
        var badge = $('#statusBadge');
        if (badge) badge.style.display = 'none';
        syncCheckinInteractiveDisabled();
      }

      async function submit(){
        if (busy) return;
        const eventId = $('#eventSelect').value.trim();
        const personId = $('#personSelect').value;
        if (!eventId) return setToast('請選擇活動。', { clearMs: 3200 });
        if (!personId) return setToast('請先選擇姓名。', { clearMs: 3200 });
        if (!action) return setToast('請先選擇「簽到」或「簽退」。', { clearMs: 3200 });
        if (getSelectedEventRequiresCheckinCode() && getEffectiveCheckinCode().length !== 6) {
          return setToast('請先輸入管理頁或看板 QR 下方顯示的 6 位驗證碼。', { clearMs: 4000 });
        }

        const pwdInput = $('#personPassword');
        const password = pwdInput ? pwdInput.value.trim() : '';
        if (currentPersonMeta && currentPersonMeta.requirePassword) {
          if (!password) {
            return setToast('此活動要求個人簽到密碼，請填寫密碼欄位。', { error: true, clearMs: 4000 });
          }
        }

        busy = true;
        setCheckinSubmittingUi(true);
        const submittedAction = action;
        const personSelEl = $('#personSelect');
        const selectedPersonName = personSelEl && personSelEl.selectedOptions[0] ? personSelEl.selectedOptions[0].textContent : '';

        try{
          const res = await api('publicSubmitAttendance', {
            eventId: eventId,
            personId: personId,
            action: action,
            font: '',
            token: getCheckinTokenForApi(),
            password: password,
            clientMeta: { ua: navigator.userAgent }
          });
          var st = (res && res.serverTime != null && String(res.serverTime) !== '') ? String(res.serverTime) : '';
          $('#serverTime').textContent = st ? ('伺服器時間 ' + fmtTs(st)) : '';

          // 伺服端回傳真確認：立即震動 [40, 30, 40]
          if (navigator && typeof navigator.vibrate === 'function') {
            try { navigator.vibrate([40, 30, 40]); } catch (_vibErr) {}
          }

          // 1. 原地顯示 1.5 秒成功反饋
          showInPlaceSuccessFeedback(selectedPersonName, submittedAction);

          // 2. 立即可動（極速連續操作）：清空姓名選單、清空搜尋框、清空個人密碼；游標自動聚焦至搜尋框
          const searchInput = $('#personSearch');
          if (searchInput) {
            searchInput.value = '';
            applyPersonFilter('');
            try { searchInput.focus(); } catch (_e) {}
          }
          if (personSelEl) personSelEl.value = '';
          if (pwdInput) pwdInput.value = '';
          updatePasswordUi(null);
          var badge = $('#statusBadge');
          if (badge) badge.style.display = 'none';

        }catch(e){
          var em = formatApiError(e);
          const hintEl = $('#submitStatusHint');
          if (hintEl) {
            hintEl.className = 'submitStatusHint is-error';
            hintEl.textContent = '❌ ' + em;
            hintEl.style.display = 'block';
          }
          if (isLikelyCheckinCodeAuthError_(em)) {
            clearCheckinCodeStorage(eventId);
            var inp3 = $('#checkinCode');
            if (inp3) inp3.value = '';
            setToast('驗證碼錯誤或已更新，請重新輸入。', { error: true });
          } else {
            setToast(em, { error: true });
          }
        }finally{
          busy = false;
          setCheckinSubmittingUi(false);
          styleCheckinActionButtons();
          syncCheckinInteractiveDisabled();
        }
      }

      // 變更密碼彈窗邏輯
      function openChangePasswordModal(){
        const modal = $('#changePasswordModal');
        const personSel = $('#personSelect');
        if (!personSel || !personSel.value) {
          setToast('請先選擇要變更密碼的人員。', { error: true });
          return;
        }
        const name = personSel.selectedOptions[0] ? personSel.selectedOptions[0].textContent : '';
        $('#pwdPersonName').value = name;
        $('#inputOldPwd').value = '';
        $('#inputNewPwd').value = '';
        $('#inputNewPwdConfirm').value = '';
        $('#pwdChangeErr').style.display = 'none';
        modal.classList.add('open');
      }

      function closeChangePasswordModal(){
        const modal = $('#changePasswordModal');
        if (modal) modal.classList.remove('open');
      }

      async function submitChangePassword(){
        const eventId = $('#eventSelect').value.trim();
        const personId = $('#personSelect').value;
        const oldPwd = $('#inputOldPwd').value.trim();
        const newPwd = $('#inputNewPwd').value.trim();
        const confirmPwd = $('#inputNewPwdConfirm').value.trim();
        const errEl = $('#pwdChangeErr');
        const btn = $('#btnSubmitChangePwd');

        if (!newPwd) {
          errEl.textContent = '請輸入新密碼。';
          errEl.style.display = 'block';
          return;
        }
        if (newPwd.length < 4 || newPwd.length > 50) {
          errEl.textContent = '新密碼長度須介於 4 至 50 字元。';
          errEl.style.display = 'block';
          return;
        }
        if (newPwd !== confirmPwd) {
          errEl.textContent = '兩次輸入的新密碼不一致。';
          errEl.style.display = 'block';
          return;
        }

        errEl.style.display = 'none';
        withButtonBusy(btn, async function(){
          try {
            await api('publicChangePassword', {
              eventId: eventId,
              personId: personId,
              oldPassword: oldPwd,
              newPassword: newPwd,
              token: getCheckinTokenForApi()
            });
            closeChangePasswordModal();
            setToast('個人密碼已成功變更！');
            if ($('#personPassword')) $('#personPassword').value = newPwd;
            await refreshStatus();
          } catch (e) {
            errEl.textContent = formatApiError(e);
            errEl.style.display = 'block';
          }
        }, { busyText: '變更中…' });
      }

      $('#btnIn').addEventListener('click', () => setAction('IN'));
      $('#btnOut').addEventListener('click', () => setAction('OUT'));
      $('#btnSubmitCheckin').addEventListener('click', () => submit());

      $('#btnSuccessResetNext').addEventListener('click', () => closeSuccessModalAndReset());
      $('#btnSuccessChangePwd').addEventListener('click', () => {
        closeSuccessModalAndReset();
        openChangePasswordModal();
      });

      $('#btnOpenChangePwd').addEventListener('click', openChangePasswordModal);
      $('#btnCloseChangePwd').addEventListener('click', closeChangePasswordModal);
      $('#btnCancelChangePwd').addEventListener('click', closeChangePasswordModal);
      $('#btnSubmitChangePwd').addEventListener('click', submitChangePassword);

      $('#eventSelect').addEventListener('change', async () => {
        $('#personSearch').value = '';
        loadPersistedCheckinCodeIntoField();
        updateCheckinCodeHintUi();
        updateCheckinGateStatusUi();
        styleCheckinActionButtons();
        try {
          await Promise.all([refreshRoster(), refreshStatus()]);
        } catch (_e) {}
        syncCheckinInteractiveDisabled();
      });

      var checkinCodeEl = $('#checkinCode');
      if (checkinCodeEl) {
        var debouncedReloadAfterCode = debounce(function(){
          var evSel = $('#eventSelect').value.trim();
          if (!evSel || !getSelectedEventRequiresCheckinCode()) return;
          if (getEffectiveCheckinCode().length !== 6) return;
          void refreshRoster();
          void refreshStatus();
        }, 280);
        checkinCodeEl.addEventListener('input', function(){
          var v = String(checkinCodeEl.value || '').replace(/\D/g, '').slice(0, 6);
          if (checkinCodeEl.value !== v) checkinCodeEl.value = v;
          persistCheckinCode();
          syncCheckinInteractiveDisabled();
          debouncedReloadAfterCode();
        });
      }

      $('#personSearch').addEventListener('input', debounce(function(){
        applyPersonFilter(($('#personSearch').value || '').trim());
      }, 180));

      $('#personSearch').addEventListener('keydown', function(ev){
        if (ev.key === 'Enter') {
          ev.preventDefault();
          var sel = $('#personSelect');
          if (sel && sel.value) {
            submit();
          }
        }
      });

      $('#personPassword').addEventListener('keydown', function(ev){
        if (ev.key === 'Enter') {
          ev.preventDefault();
          submit();
        }
      });

      $('#personSelect').addEventListener('change', function(){
        void refreshStatus();
      });

      setAction('IN');
      bootstrapCheckinFromGasUrl_(function(){
        void loadEventsCheckin();
      });
    </script>
  </body>
</html>
