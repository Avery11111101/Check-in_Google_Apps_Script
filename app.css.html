<style>
  :root{
    --bg:#0f1115;
    --surface:#151824;
    --surface2:#10131d;
    --text:#f2f5ff;
    --muted:#a8b0c7;
    --border:rgba(255,255,255,.10);
    --ok:#34c37a;
    --warn:#ff9f1a;
    --bad:#ff5a5f;
    --not:#6b738a;
    --accent:#7aa7ff;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family: ui-sans-serif, system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color:var(--text);
  }
  .appBg{
    min-height: 100dvh;
    background: radial-gradient(900px 420px at 30% -20%, rgba(122,167,255,.10), transparent 58%),
                radial-gradient(860px 420px at 95% -10%, rgba(52,195,122,.07), transparent 62%),
                var(--bg);
  }
  a{ color:inherit; }
  .container{ max-width:1120px; margin:0 auto; padding:20px; }
  .topbar{ display:flex; justify-content:space-between; align-items:center; gap:14px; padding:14px 16px; background:rgba(21,24,36,.90); border:1px solid var(--border); border-radius:14px; }
  .title{ font-weight:800; letter-spacing:.2px; }
  .subtitle{ color:var(--muted); font-size:13px; margin-top:4px; }
  .badge{ font-size:12px; color:var(--muted); padding:6px 10px; border:1px solid var(--border); border-radius:999px; background:rgba(16,19,29,.55); }
  .grid{ display:grid; grid-template-columns: 1.1fr .9fr; gap:14px; margin-top:14px; }
  @media (max-width: 920px){ .grid{ grid-template-columns:1fr; } }
  .card{ background:rgba(21,24,36,.90); border:1px solid var(--border); border-radius:14px; padding:14px; }
  .card h2{ margin:0 0 10px 0; font-size:15px; letter-spacing:.2px; }
  .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .field{ display:flex; flex-direction:column; gap:6px; margin-top:10px; }
  label{ font-size:12px; color:var(--muted); }
  input, select, textarea{
    width:100%;
    padding:10px 12px;
    border-radius:12px;
    border:1px solid var(--border);
    background:rgba(16,19,29,.90);
    color:var(--text);
    outline:none;
  }
  input:focus, select:focus, textarea:focus{
    border-color: rgba(122,167,255,.45);
    box-shadow: 0 0 0 3px rgba(122,167,255,.12);
  }
  input::placeholder, textarea::placeholder{ color:rgba(170,182,230,.6); }
  button{
    border:1px solid var(--border);
    background: rgba(122,167,255,.18);
    color: var(--text);
    padding:10px 12px;
    border-radius:12px;
    cursor:pointer;
    font-weight:650;
  }
  button.secondary{ background: rgba(255,255,255,.06); }
  button.danger{ background: rgba(255,90,95,.16); }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  /** 管理頁：簽到開關與目前狀態對應的按鈕強調 */
  button.toggle-active-open{
    background: rgba(52,195,122,.30);
    border-color: rgba(52,195,122,.48);
    box-shadow: inset 0 0 0 1px rgba(52,195,122,.12);
  }
  button.toggle-active-close{
    background: rgba(255,159,26,.24);
    border-color: rgba(255,159,26,.48);
    box-shadow: inset 0 0 0 1px rgba(255,159,26,.12);
  }
  button.toggle-inactive{
    opacity: .58;
    background: rgba(255,255,255,.05);
  }
  /** 簽到頁：已選簽到／簽退 */
  button.action-selected-in{
    background: rgba(52,195,122,.30);
    border-color: rgba(52,195,122,.48);
    box-shadow: inset 0 0 0 1px rgba(52,195,122,.12);
  }
  button.action-selected-out{
    background: rgba(255,159,26,.24);
    border-color: rgba(255,159,26,.48);
    box-shadow: inset 0 0 0 1px rgba(255,159,26,.12);
  }
  button.action-unselected{
    opacity: .58;
    background: rgba(255,255,255,.05);
  }
  .openStatusPill{
    margin-top:10px;
    align-self:flex-start;
  }
  .openStatusPill strong{ font-weight:800; color: rgba(242,245,255,.95); }
  .pill{ display:inline-flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--border); border-radius:999px; background:rgba(16,19,29,.70); }
  .dot{ width:10px; height:10px; border-radius:999px; background:var(--not); }
  .dot.ok{ background:var(--ok); } .dot.warn{ background:var(--warn); } .dot.bad{ background:var(--bad); }
  .hint{ font-size:12px; color:var(--muted); line-height:1.55; }
  .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  .toast{ margin-top:10px; font-size:13px; color:var(--muted); }
  .toast.toast--error{ color:#ffc9cb; }
  .copyRow{
    display:flex; align-items:stretch; gap:10px; width:100%;
  }
  .copyRow__input{ flex:1; min-width:0; width:auto; max-width:100%; }
  .copyRow button{ flex-shrink:0; white-space:nowrap; }
  .banner-error{
    margin-top:8px; padding:10px 12px; border-radius:12px;
    border:1px solid rgba(255,90,95,.35); background:rgba(255,90,95,.10);
    color:#ffc9cb; font-size:13px; line-height:1.5; white-space:pre-wrap;
  }
  .topActions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

  /* nav */
  .nav{ display:flex; gap:8px; flex-wrap:wrap; }
  .nav a{
    text-decoration:none;
    font-size:13px;
    padding:8px 10px;
    border-radius:999px;
    border:1px solid var(--border);
    background: rgba(16,19,29,.55);
    color: rgba(242,245,255,.92);
  }
  .nav a[aria-current="page"]{
    border-color: rgba(122,167,255,.55);
    background: rgba(122,167,255,.16);
  }
  .nav a:hover{ border-color: rgba(255,255,255,.18); }

  /* compact list row */
  .list{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .listRow{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:10px 12px;
    border-radius:12px; border:1px solid var(--border);
    background: rgba(16,19,29,.70);
  }
  .listRow .name{ font-weight:750; }
  .listRow .meta{ font-size:12px; color:var(--muted); margin-top:4px; }
  .listRow .right{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

  /* slide confirm */
  .slideWrap{ margin-top:14px; padding:14px; border:1px solid var(--border); border-radius:14px; background:rgba(16,19,29,.70); }
  .slideLabel{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .slideBar{ position:relative; height:54px; border-radius:14px; background:rgba(255,255,255,.05); border:1px solid var(--border); overflow:hidden; }
  .slideText{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:rgba(242,245,255,.86); font-weight:750; letter-spacing:.2px; pointer-events:none; }
  .thumb{
    position:absolute; top:6px; right:6px;
    height:40px; width:160px;
    border-radius:14px;
    background: rgba(122,167,255,.20);
    border:1px solid rgba(122,167,255,.35);
    display:flex; align-items:center; justify-content:center;
    cursor:grab;
    user-select:none;
    font-weight:800;
    outline:none;
  }
  .thumb:focus-visible{
    box-shadow: 0 0 0 3px rgba(122,167,255,.35);
    border-color: rgba(122,167,255,.55);
  }
  .thumb.is-busy, .slideBar.is-busy .thumb{
    opacity:.55;
    cursor:not-allowed;
    pointer-events:none;
  }
  .slideBar.is-busy{ opacity:.92; }
  .slideBar.is-gated{
    opacity:.62;
    pointer-events:none;
  }
  .thumb:active{ cursor:grabbing; }

  /* board */
  .boardCols{ display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; margin-top:12px; }
  @media (max-width: 920px){ .boardCols{ grid-template-columns: 1fr; } }
  .person{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; border-radius:12px; border:1px solid var(--border); background: rgba(16,19,29,.70); }
  .person .name{ font-weight:800; }
  .person .meta{ font-size:12px; color:var(--muted); }
  .statusTag{ font-size:12px; padding:5px 8px; border-radius:999px; border:1px solid var(--border); background:rgba(255,255,255,.06); color:var(--muted); white-space:nowrap; }
  .statusTag.ok{ color:rgba(53,208,127,.95); background: rgba(53,208,127,.12); }
  .statusTag.bad{ color:rgba(255,93,93,.95); background: rgba(255,93,93,.12); }
  .statusTag.not{ color:rgba(106,123,184,.95); background: rgba(106,123,184,.12); }
  .groupTitle{ margin:10px 0 6px; font-size:13px; color:rgba(232,238,255,.92); font-weight:750; }

  /* QR */
  .qrBox{
    display:inline-block;
    margin-top:8px;
    padding:12px;
    border-radius:12px;
    background:#fff;
    border:1px solid rgba(0,0,0,.08);
    line-height:0;
  }
  .qrBox img, .qrBox canvas{ display:block; }
  .qrBox--board img, .qrBox--board canvas{
    max-width:min(72vw, 420px);
    width:100%;
    height:auto;
  }
  .boardQrHeroHint{ color: var(--muted); line-height:1.55; }

  /* 看板：固定角落 QR */
  .boardQrDock{
    position: fixed;
    bottom: max(12px, env(safe-area-inset-bottom, 0px));
    right: max(12px, env(safe-area-inset-right, 0px));
    z-index: 10000;
    padding: 10px 12px 12px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: rgba(14,17,26,.94);
    box-shadow: 0 10px 36px rgba(0,0,0,.4);
    max-width: min(44vw, 200px);
    text-align: center;
  }
  .boardQrDock__label{
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .06em;
    color: rgba(232,238,255,.88);
    margin-bottom: 6px;
  }
  .boardQrDock__hint{
    margin-top: 6px;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.35;
  }
  .qrBox--dock{
    margin-top: 0;
    padding: 8px;
  }
  .qrBox--dock img, .qrBox--dock canvas{
    width: 112px;
    height: 112px;
    max-width: min(28vw, 132px);
    max-height: min(28vw, 132px);
  }

  /* 看板：資料更新全螢幕轉場（由右入、向左出） */
  .boardTransitionLayer{
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9998;
    pointer-events: none;
    overflow: hidden;
  }
  .boardTransitionLayer__panel{
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, rgba(10,12,18,.15) 0%, rgba(16,19,29,.9) 42%, rgba(16,19,29,.94) 100%);
    transform: translateX(100%);
    transition: transform 0.42s ease-out;
  }
  .boardTransitionLayer--in .boardTransitionLayer__panel{
    transform: translateX(0);
  }
  .boardTransitionLayer--out .boardTransitionLayer__panel{
    transform: translateX(-100%);
    transition: transform 0.4s ease-in;
  }

  /* 看板：6 位驗證碼授權 */
  .boardPairModal{
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10002;
    align-items: center;
    justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: rgba(6,8,12,.78);
  }
  .boardPairModal--open{
    display: flex;
  }
  .boardPairModal__card{
    width: 100%;
    max-width: 400px;
    padding: 20px 22px 22px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: rgba(16,19,29,.96);
    box-shadow: 0 16px 48px rgba(0,0,0,.45);
  }
  .boardPairModal__title{
    margin: 0 0 10px;
    font-size: 1.15rem;
    font-weight: 850;
  }
  .boardPairModal__text{ margin: 0 0 14px; }
  .boardPairModal__input{
    width: 100%;
    box-sizing: border-box;
    font-size: 1.35rem;
    letter-spacing: 0.25em;
    text-align: center;
    padding: 12px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(10,12,18,.65);
    color: var(--text, #e8eeff);
  }
  .boardPairModal__actions{
    margin-top: 14px;
    justify-content: flex-end;
  }

  .boardToolbar{ margin-top:0; }
  .boardQrHero{
    margin-top:12px;
    margin-bottom:14px;
    padding:14px;
    border-radius:14px;
    border:1px solid var(--border);
    background: rgba(16,19,29,.55);
    text-align:center;
  }
  .boardQrTitle{
    font-size:14px;
    font-weight:800;
    color: rgba(242,245,255,.92);
    margin-bottom:10px;
    letter-spacing:.2px;
  }
  .boardQrHint{ margin-top:10px; }

  /* 管理頁：看板配對碼 */
  .boardPairCodeDisplay{
    margin-top:12px;
    padding:14px 16px;
    border-radius:12px;
    border:1px solid var(--border);
    background: rgba(16,19,29,.72);
    text-align:center;
  }
  .boardPairCodeBig{
    font-size:clamp(1.75rem, 5vw, 2.35rem);
    font-weight:850;
    letter-spacing:0.35em;
    color: rgba(242,245,255,.96);
  }

  /* board stats */
  .statsBar{
    display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:center;
    padding:10px 12px; border-radius:12px; border:1px solid var(--border);
    background: rgba(16,19,29,.55);
    margin-top: 12px;
    color: rgba(242,245,255,.92);
  }
  .statsBar strong{ font-weight:850; }

  /* 簽到頁：窄螢幕／安全區（僅 body.page-checkin） */
  @media (max-width: 520px){
    .page-checkin .container{
      padding: 12px;
      padding-left: max(12px, env(safe-area-inset-left, 0px));
      padding-right: max(12px, env(safe-area-inset-right, 0px));
      padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
      padding-top: max(12px, env(safe-area-inset-top, 0px));
    }
    .page-checkin .topbar{
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
    }
    .page-checkin .topActions{
      justify-content: flex-start;
    }
    .page-checkin .checkinActionRow{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }
    .page-checkin .checkinActionRow button{
      min-height: 44px;
      width: 100%;
    }
    .page-checkin .slideLabel{
      flex-wrap: wrap;
      gap: 8px;
      row-gap: 6px;
      align-items: center;
    }
    .page-checkin .slideLabel .pill{
      min-width: 0;
      max-width: 100%;
    }
    .page-checkin #serverTime{
      font-size: 11px;
      margin-left: auto;
      max-width: 100%;
      text-align: right;
      white-space: normal;
    }
    .page-checkin .openStatusPill{
      display: inline-flex;
      flex-wrap: wrap;
      max-width: 100%;
      font-size: 12px;
      line-height: 1.45;
      align-items: center;
      gap: 6px;
    }
    .page-checkin .slideBar{
      height: 58px;
    }
    .page-checkin .thumb{
      height: 44px;
      top: 7px;
      width: min(160px, 48%);
    }
  }
</style>
